package: tinymce

version: '8.13.0'
author: Friends Of REDAXO
supportpage: https://github.com/FriendsOfREDAXO/tinymce/issues

default_config:
    media_upload_settings:
        upload_enabled: false
        paste_images_enabled: false
        upload_default_category: -1
        upload_media_manager_type: ''

page:
    title: 'translate:title'
    perm: admin
    subpages:
        main:
            title: 'translate:main'
        settings:
            title: 'translate:settings'
        profiles:
            title: 'translate:profiles'
        snippets:
            title: 'translate:snippets'
        stylesets:
            title: 'translate:stylesets'
        paste_settings:
            title: 'translate:paste_settings'
        migration:
            title: 'translate:migration'
            subPath: pages/profile_fixer.php
            hidden: true
        help:
            title: 'translate:help'
            subPath: README.md
        for_plugins:
            title: 'translate:for_plugins'
            subPath: FOR_PLUGINS.md
        devs:
            title: 'translate:devs'
            subPath: DEVS.md

pages:
    insertlink:
        title: translate:insertlink
        main: true
        block: system
        popup: true
        hidden: true
        perm: structure/hasStructurePerm
        pjax: true

requires:
    redaxo: '^5.13'
    php: '>=8.1'

permissions:
    tinymce_addon[]: 'translate:tinymce_perm_addon'
    tinymce[paste_images]: 'translate:tinymce_perm_paste_images'

conflicts:
    packages:
        tinymce4: '>=0.0.0'
        tinymce5: '>=0.0.0'
        tinymce: '<8.8.0'

installer_ignore:
    - .github
    - pnpm-workspace.yaml
    - .php-cs-fixer.php
    - custom_plugins
